<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Shopping Cart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .cart-transition { transition: all 0.3s ease; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">

    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-2">
                    <div class="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center text-white">
                        <i class="fas fa-shopping-bag text-xl"></i>
                    </div>
                    <span class="text-xl font-bold tracking-tight">SwiftCart</span>
                </div>
                <div class="relative cursor-pointer" id="cart-icon">
                    <i class="fas fa-shopping-cart text-2xl text-gray-600 hover:text-indigo-600 transition-colors"></i>
                    <span id="cart-count" class="absolute -top-2 -right-2 bg-indigo-600 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full min-w-[20px] text-center">0</span>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex flex-col lg:flex-row gap-8">
            
            <div class="lg:w-2/3">
                <h2 class="text-2xl font-bold mb-6">Featured Products</h2>
                <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <!-- Products will be injected here by JS -->
                </div>
            </div>

            <div class="lg:w-1/3">
                <div class="bg-white rounded-2xl shadow-sm p-6 sticky top-24 border border-gray-100">
                    <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
                        <i class="fas fa-receipt text-indigo-500"></i> Order Summary
                    </h2>
                    
                    <div id="cart-items" class="space-y-4 max-h-[400px] overflow-y-auto mb-6 pr-2">
                        <!-- Cart items injected here -->
                        <div class="text-center py-8 text-gray-400 italic" id="empty-cart-msg">
                            Your cart is empty
                        </div>
                    </div>

                    <div class="border-t border-gray-100 pt-4 space-y-3">
                        <div class="flex justify-between text-gray-600">
                            <span>Subtotal</span>
                            <span id="subtotal-price">$0.00</span>
                        </div>
                        <div class="flex justify-between text-gray-600">
                            <span>Shipping</span>
                            <span id="shipping-price">$0.00</span>
                        </div>
                        <div class="flex justify-between text-gray-600">
                            <span>Estimated Tax (10%)</span>
                            <span id="tax-price">$0.00</span>
                        </div>
                        <div class="flex justify-between text-xl font-bold pt-3 border-t border-gray-100">
                            <span>Total</span>
                            <span id="total-price" class="text-indigo-600">$0.00</span>
                        </div>
                    </div>

                    <button class="w-full mt-8 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl transition-all shadow-lg shadow-indigo-200 active:scale-[0.98]" onclick="checkout()">
                        Checkout Now
                    </button>
                    
                    <p class="text-center text-xs text-gray-400 mt-4">
                        Secure SSL Encryption & 30-Day Returns
                    </p>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Mock Product Data
        const products = [
            { id: 1, name: "Premium Wireless Headphones", price: 299.99, image: "https://placehold.co/400x300/6366f1/ffffff?text=Headphones", category: "Electronics" },
            { id: 2, name: "Minimalist Smart Watch", price: 199.50, image: "https://placehold.co/400x300/8b5cf6/ffffff?text=Watch", category: "Wearables" },
            { id: 3, name: "Mechanical Gaming Keyboard", price: 129.00, image: "https://placehold.co/400x300/ec4899/ffffff?text=Keyboard", category: "Accessories" },
            { id: 4, name: "Ergonomic Office Chair", price: 450.00, image: "https://placehold.co/400x300/f59e0b/ffffff?text=Chair", category: "Furniture" }
        ];

        let cart = JSON.parse(localStorage.getItem('swiftcart_data')) || [];

        function init() {
            renderProducts();
            updateUI();
        }

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = products.map(product => `
                <div class="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition-shadow border border-gray-100 group">
                    <div class="relative overflow-hidden">
                        <img src="${product.image}" alt="${product.name}" class="w-full h-48 object-cover group-hover:scale-105 transition-transform duration-500">
                        <div class="absolute top-3 left-3 bg-white/90 backdrop-blur px-2 py-1 rounded-md text-xs font-semibold text-indigo-600">
                            ${product.category}
                        </div>
                    </div>
                    <div class="p-5">
                        <h3 class="font-bold text-lg mb-1">${product.name}</h3>
                        <p class="text-indigo-600 font-bold text-xl mb-4">$${product.price.toFixed(2)}</p>
                        <button onclick="addToCart(${product.id})" class="w-full bg-gray-900 hover:bg-indigo-600 text-white py-3 rounded-xl font-medium transition-colors flex items-center justify-center gap-2">
                            <i class="fas fa-plus"></i> Add to Cart
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existingItem = cart.find(item => item.id === productId);

            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            saveAndRefresh();
        }

        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            saveAndRefresh();
        }

        function updateQuantity(productId, delta) {
            const item = cart.find(item => item.id === productId);
            if (item) {
                item.quantity += delta;
                if (item.quantity <= 0) {
                    removeFromCart(productId);
                } else {
                    saveAndRefresh();
                }
            }
        }

        function saveAndRefresh() {
            localStorage.setItem('swiftcart_data', JSON.stringify(cart));
            updateUI();
        }

        function updateUI() {
            const cartList = document.getElementById('cart-items');
            const emptyMsg = document.getElementById('empty-cart-msg');
            const cartCount = document.getElementById('cart-count');
            
            // Update items count
            const totalItems = cart.reduce((acc, item) => acc + item.quantity, 0);
            cartCount.innerText = totalItems;

            if (cart.length === 0) {
                cartList.innerHTML = '';
                cartList.appendChild(emptyMsg);
                emptyMsg.classList.remove('hidden');
            } else {
                emptyMsg.classList.add('hidden');
                cartList.innerHTML = cart.map(item => `
                    <div class="flex gap-4 items-center bg-gray-50 p-3 rounded-xl border border-gray-100">
                        <img src="${item.image}" class="w-16 h-16 rounded-lg object-cover">
                        <div class="flex-1">
                            <h4 class="text-sm font-bold text-gray-800 leading-tight">${item.name}</h4>
                            <p class="text-indigo-600 text-sm font-semibold mt-1">$${(item.price * item.quantity).toFixed(2)}</p>
                            <div class="flex items-center gap-3 mt-2">
                                <button onclick="updateQuantity(${item.id}, -1)" class="w-6 h-6 rounded-full bg-white border border-gray-200 flex items-center justify-center hover:bg-gray-100 transition-colors">
                                    <i class="fas fa-minus text-[10px]"></i>
                                </button>
                                <span class="text-sm font-medium w-4 text-center">${item.quantity}</span>
                                <button onclick="updateQuantity(${item.id}, 1)" class="w-6 h-6 rounded-full bg-white border border-gray-200 flex items-center justify-center hover:bg-gray-100 transition-colors">
                                    <i class="fas fa-plus text-[10px]"></i>
                                </button>
                            </div>
                        </div>
                        <button onclick="removeFromCart(${item.id})" class="text-gray-400 hover:text-red-500 transition-colors">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                `).join('');
            }

            // Calculate Totals
            const subtotal = cart.reduce((acc, item) => acc + (item.price * item.quantity), 0);
            const shipping = subtotal > 0 ? (subtotal > 500 ? 0 : 15.00) : 0;
            const tax = subtotal * 0.10;
            const total = subtotal + shipping + tax;

            document.getElementById('subtotal-price').innerText = `$${subtotal.toFixed(2)}`;
            document.getElementById('shipping-price').innerText = shipping === 0 && subtotal > 0 ? 'FREE' : `$${shipping.toFixed(2)}`;
            document.getElementById('tax-price').innerText = `$${tax.toFixed(2)}`;
            document.getElementById('total-price').innerText = `$${total.toFixed(2)}`;
        }

        function checkout() {
            if (cart.length === 0) {
                showToast("Your cart is empty!", "error");
                return;
            }
            // Mock checkout process
            showToast("Processing order... Thank you for your purchase!", "success");
            cart = [];
            saveAndRefresh();
        }

        function showToast(message, type) {
            const toast = document.createElement('div');
            toast.className = `fixed bottom-5 right-5 px-6 py-3 rounded-xl shadow-2xl text-white font-medium z-[100] transform transition-all duration-300 translate-y-10 opacity-0 ${type === 'success' ? 'bg-green-500' : 'bg-red-500'}`;
            toast.innerText = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove('translate-y-10', 'opacity-0');
            }, 100);

            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        window.onload = init;
    </script>
</body>
</html>
